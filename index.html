<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedir Canción al DJ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .contenedor {
      max-width: 400px;
      margin: 30px auto;
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 { color: #1db954; font-size: 24px; margin-bottom: 5px; }
    p { color: #b3b3b3; font-size: 14px; }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 90%;
      padding: 14px;
      background-color: #1db954;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .mensaje-bloqueado {
      display: none;
      background-color: #333;
      padding: 20px;
      border-radius: 12px;
      color: #ff5555;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>🎧 Pide tu Canción</h1>
    <p>Escribe el nombre del tema que quieres escuchar</p>

    <!-- Formulario para pedir canciones -->
    <div id="seccion-pedido">
      <input type="text" id="nombreInvitado" placeholder="Tu nombre (opcional)">
      <input type="text" id="cancion" placeholder="Canción y Artista">
      <button onclick="enviarCancion()">Enviar Petición 🔥</button>
    </div>

    <!-- Mensaje cuando el DJ apaga las peticiones -->
    <div id="seccion-cerrada" class="mensaje-bloqueado">
      🚫 El DJ ha desactivado temporalmente la recepción de canciones.
    </div>
  </div>

  <!-- Conexión a Firebase Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ⚠️ REEMPLAZA EL BLOQUE DE ABAJO CON TUS LLAVES DEL PASO 6:
   const firebaseConfig = {
  apiKey: "AIzaSyDGbqAffr9eoeFmTwCVNTO6qSOwaJmQkHw",
  authDomain: "appdjevento.firebaseapp.com",
  databaseURL: "https://appdjevento-default-rtdb.firebaseio.com",
  projectId: "appdjevento",
  storageBucket: "appdjevento.firebasestorage.app",
  messagingSenderId: "407123662465",
  appId: "1:407123662465:web:7920863152e086a221df80"
};

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Comprobar en tiempo real si el DJ activó o desactivó el QR
    db.ref("estadoQR").on("value", (snapshot) => {
      const activo = snapshot.val();
      if (activo === false) {
        document.getElementById("seccion-pedido").style.display = "none";
        document.getElementById("seccion-cerrada").style.display = "block";
      } else {
        document.getElementById("seccion-pedido").style.display = "block";
        document.getElementById("seccion-cerrada").style.display = "none";
      }
    });

    // Función para enviar la canción
    function enviarCancion() {
      const tema = document.getElementById("cancion").value.trim();
      const invitado = document.getElementById("nombreInvitado").value.trim() || "Anónimo";

      if (tema === "") {
        alert("Por favor escribe el nombre de una canción.");
        return;
      }

      // Guardar en Realtime Database
      db.ref("peticiones").push({
        invitado: invitado,
        cancion: tema,
        fecha: new Date().toLocaleTimeString()
      }).then(() => {
        alert("¡Canción enviada al DJ con éxito!");
        document.getElementById("cancion").value = "";
      }).catch((error) => {
        alert("Error al enviar: " + error.message);
      });
    }
  </script>

</body>
</html>
