<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedir Canción al DJ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: white;
      padding: 20px;
      margin: 0;
      text-align: center;
    }
    .contenedor {
      max-width: 450px;
      margin: 0 auto;
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 { color: #1db954; font-size: 24px; margin-bottom: 5px; }
    p { color: #bbb; font-size: 14px; margin-bottom: 15px; }
    
    .caja-busqueda {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn-plataforma {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: bold;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: white;
      transition: opacity 0.2s;
    }
    .btn-spotify { background-color: #1db954; }
    .btn-youtube { background-color: #ff0000; }
    .btn-plataforma:hover { opacity: 0.85; }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: white;
      box-sizing: border-box;
      font-size: 15px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      height: 60px;
    }
    button.btn-enviar {
      width: 100%;
      padding: 12px;
      background-color: #1db954;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button.btn-enviar:hover { background-color: #1ed760; }
    
    #mensaje {
      margin-top: 15px;
      font-weight: bold;
    }
    .cerrado {
      color: #ff4d4d;
      font-weight: bold;
    }

    /* Estilos para la lista pública de canciones */
    .seccion-lista {
      margin-top: 25px;
      border-top: 1px solid #333;
      padding-top: 20px;
      text-align: left;
    }
    .seccion-lista h3 {
      color: #1db954;
      font-size: 18px;
      margin-bottom: 12px;
      text-align: center;
    }
    .tarjeta-invitado {
      background-color: #2a2a2a;
      border-left: 4px solid #1db954;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .tarjeta-invitado strong {
      color: #fff;
    }
    .tarjeta-invitado small {
      color: #bbb;
      display: block;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="contenedor">
    <h1>🎧 Pide tu Canción al DJ</h1>
    <p>¡Busca el nombre de la canción o pídela directamente!</p>

    <!-- Botones directos a plataformas -->
    <div class="caja-busqueda">
      <a href="https://open.spotify.com" target="_blank" class="btn-plataforma btn-spotify">
        🟢 Abrir Spotify
      </a>
      <a href="https://www.youtube.com" target="_blank" class="btn-plataforma btn-youtube">
        🔴 Abrir YouTube
      </a>
    </div>

    <div id="formulario">
      <input type="text" id="invitado" placeholder="Tu nombre / apodo" required>
      <input type="text" id="cancion" placeholder="Nombre de la canción y artista" required>
      <textarea id="nota" placeholder="💬 Mensaje o dedicatoria para el DJ (opcional)"></textarea>
      <button class="btn-enviar" onclick="enviarPedido()">Enviar Pedido 🚀</button>
    </div>

    <div id="mensaje"></div>

    <!-- Lista en tiempo real de lo que han pedido otros -->
    <div class="seccion-lista">
      <h3>📜 Canciones en Cola</h3>
      <div id="lista-publica">Cargando cola de reproducción...</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDGbqAffr9eoeFmTwCVNTO6qSOwaJmQkHw",
      authDomain: "appdjevento.firebaseapp.com",
      databaseURL: "https://appdjevento-default-rtdb.firebaseio.com",
      projectId: "appdjevento",
      storageBucket: "appdjevento.firebasestorage.app",
      messagingSenderId: "407123662465",
      appId: "1:407123662465:web:7920863152e086a221df80"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let receptorActivo = true;

    // Escuchar si el DJ tiene abiertos los pedidos
    db.ref("estadoQR").on("value", (snapshot) => {
      const val = snapshot.val();
      receptorActivo = val !== false;

      const form = document.getElementById("formulario");
      const msg = document.getElementById("mensaje");

      if (!receptorActivo) {
        form.style.display = "none";
        msg.innerHTML = "<p class='cerrado'>🚫 La recepción de pedidos está pausada por el DJ en este momento.</p>";
      } else {
        form.style.display = "block";
        msg.innerHTML = "";
      }
    });

    // Escuchar peticiones en tiempo real para la lista de invitados
    db.ref("peticiones").on("value", (snapshot) => {
      const contenedor = document.getElementById("lista-publica");
      contenedor.innerHTML = "";

      const datos = snapshot.val();
      if (!datos) {
        contenedor.innerHTML = "<p style='color:#bbb; text-align:center;'>Aún no hay canciones en la lista. ¡Sé el primero!</p>";
        return;
      }

      Object.keys(datos).forEach((key) => {
        const item = datos[key];
        const div = document.createElement("div");
        div.className = "tarjeta-invitado";
        div.innerHTML = `
          <strong>🎶 ${item.cancion}</strong>
          <small>Pedida por: ${item.invitado} [${item.fecha}]</small>
        `;
        contenedor.appendChild(div);
      });
    });

    // Enviar canción a Firebase
    function enviarPedido() {
      const invitado = document.getElementById("invitado").value.trim();
      const cancion = document.getElementById("cancion").value.trim();
      const nota = document.getElementById("nota").value.trim();
      const msg = document.getElementById("mensaje");

      if (!invitado || !cancion) {
        msg.style.color = "#ff4d4d";
        msg.textContent = "Por favor completa tu nombre y la canción.";
        return;
      }

      const ahora = new Date();
      const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      db.ref("peticiones").push({
        invitado: invitado,
        cancion: cancion,
        nota: nota,
        fecha: hora
      }).then(() => {
        msg.style.color = "#1db954";
        msg.textContent = "¡Pedido enviado con éxito! 🎶";
        document.getElementById("cancion").value = "";
        document.getElementById("nota").value = "";
      }).catch((err) => {
        msg.style.color = "#ff4d4d";
        msg.textContent = "Error al enviar. Intenta de nuevo.";
      });
    }
  </script>

</body>
</html>
